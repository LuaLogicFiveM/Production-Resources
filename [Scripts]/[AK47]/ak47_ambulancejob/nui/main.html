<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Death UI</title>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&family=Inter:wght@400;600;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        #app {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgb(20 0 0 / 69%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            user-select: none;
            padding-bottom: 3rem;
            display: none;
        }

        .hidden { display: none !important; }

        /* Text Styles */
        .color-r { color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.8); }
        .color-g { color: #22c55e; text-shadow: 0 0 10px rgba(34, 197, 94, 0.8); }
        .color-y { color: #eab308; }
        .color-b { color: #3b82f6; }
        .color-s { color: #f8fafc; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .text-glow { text-shadow: 0 0 20px rgba(0,0,0,0.8); }

        /* Animations */
        @keyframes heartbeat {
            0%, 10%, 50%, 100% { transform: scale(1); opacity: 0.8; }
            5% { transform: scale(1.1); opacity: 1; }
            15% { transform: scale(1.15); opacity: 1; }
        }
        @keyframes ekg-flow {
            0% { clip-path: inset(0 100% 0 0); opacity: 0.2; }
            50% { opacity: 1; }
            100% { clip-path: inset(0 0 0 0); opacity: 0; }
        }

        .icon-pulse { animation: heartbeat 2s infinite; }
        .pulse-bg {
            position: absolute;
            top: 10rem;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 62rem;
            height: auto;
            z-index: 0;
            opacity: 0.6;
            animation: ekg-flow 2.5s linear infinite;
        }

        /* Side Cards */
        .side-card {
            padding: 1rem;
            width: 20rem;
        }

        .side-card-right {
            border-left: none;
            border-right: 4px solid #ef4444;
        }

        /* Skelly Bars */
        .damage-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            width: 100%;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }
        .damage-bar-fill {
            height: 100%;
            background: #ef4444;
            transition: width 0.5s ease;
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .keycap {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom-width: 3px;
            border-radius: 6px;
            min-width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            margin-right: 8px;
            font-family: 'Chakra Petch', sans-serif;
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        .grunge-text {
            color: transparent !important;
            background-image: linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)), url('./imgs/grunge.png'), linear-gradient(#ffffff, #ffffff);
            -webkit-background-clip: text;
            background-size: 116rem;
            background-position: 1rem 31rem;
            filter: brightness(1.5) contrast(1.2);
        }

        @media screen and (min-device-height: 720px) and (max-device-height: 1079px) {
          #app {
            zoom: 70%;
          }
        }

        @media screen and (min-device-height: 1440px) and (max-device-height: 2159px) {
          #app {
            zoom: 120%;
          }
        }

        @media screen and (min-device-height: 2160px) and (max-device-height: 2879px) {
          #app {
            zoom: 180%;
          }
        } 

        @media screen and (min-device-height: 2880px) and (max-device-height: 4319px) {
          #app {
            zoom: 230%;
          }
        } 

        @media screen and (min-device-height: 4320px) {
          #app {
            zoom: 380%;
          }
        }
    </style>
</head>
<body>

    <div> 
        <audio id="heartbeat" loop autoplay>
             <source src="beat.mp3" type="audio/mpeg" muted>
         </audio>
    </div>

    <div id="app">
        <div class="mt-24 flex flex-col items-center text-center w-full z-10">
            <img src="./imgs/pulse.png" alt="pulse" class="pulse-bg">
            <div class="mb-4 relative flex items-center justify-center">
                <div class="absolute inset-0 bg-red-600 rounded-full blur-2xl opacity-30 animate-pulse"></div>
                <img src="./imgs/skull.png" alt="Incapacitated" class="w-[7rem] h-[7rem] object-contain icon-pulse drop-shadow-2xl relative z-10">
            </div>
            
            <h1 id="ui-incapacitated" class="text-6xl font-bold grunge-text text-white tracking-[0.1em] uppercase text-glow" style="font-family: 'Inter', sans-serif;">
                Incapacitated
            </h1>
        </div>

        <div id="skelly-info-container" class="absolute left-[4rem] top-1/2 -translate-y-1/2 flex flex-col gap-4 items-center">
            <div class="relative w-[20rem] h-[32rem]">
                <img src="./imgs/body.png" class="absolute top-0 left-0 w-full h-full object-contain opacity-80">
                <img id="skelly-head-img" src="./imgs/head.png" class="absolute top-0 left-0 w-full h-full object-contain transition-opacity duration-300" style="opacity: 0;">
                <img id="skelly-chest-img" src="./imgs/chest.png" class="absolute top-0 left-0 w-full h-full object-contain transition-opacity duration-300" style="opacity: 0;">
                <img id="skelly-larm-img" src="./imgs/larm.png" class="absolute top-0 left-0 w-full h-full object-contain transition-opacity duration-300" style="opacity: 0;">
                <img id="skelly-rarm-img" src="./imgs/rarm.png" class="absolute top-0 left-0 w-full h-full object-contain transition-opacity duration-300" style="opacity: 0;">
                <img id="skelly-lleg-img" src="./imgs/lleg.png" class="absolute top-0 left-0 w-full h-full object-contain transition-opacity duration-300" style="opacity: 0;">
                <img id="skelly-rleg-img" src="./imgs/rleg.png" class="absolute top-0 left-0 w-full h-full object-contain transition-opacity duration-300" style="opacity: 0;">
            </div>
        </div>

        <div id="killer-info-container" class="side-card side-card-right absolute right-[4rem] top-1/2 -translate-y-1/2 flex flex-col gap-4">
            <h2 id="ui-incident-report" class="text-sm text-gray-400 uppercase tracking-widest font-bold border-b border-white/10 pb-2 mb-1 text-right">Incident Report</h2>
            
            <div class="flex items-center gap-4 flex-row-reverse text-right">
                <div class="bg-red-500/20 p-3 rounded-lg min-w-[3rem] text-center">
                    <i class="relative right-[2px] fa-solid fa-person-rifle text-red-400 text-2xl"></i>
                </div>
                <div>
                    <p id="ui-killed-by" class="text-xs text-gray-500 uppercase font-bold">Killed By</p>
                    <p class="text-xl font-bold text-white tracking-wide w-[20rem]" id="killer-name">Unknown</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 flex-row-reverse text-right">
                <div class="bg-gray-700/40 p-3 rounded-lg min-w-[3rem] text-center">
                    <i class="fa-solid fa-gun text-gray-300 text-xl"></i>
                </div>
                <div>
                    <p id="ui-weapon" class="text-xs text-gray-500 uppercase font-bold">Weapon</p>
                    <p class="text-lg text-red-300 tracking-wide truncate w-40" id="weapon-name">Unknown</p>
                </div>
            </div>
        </div>

        <div class="w-full max-w-5xl flex flex-col items-center px-4 space-y-6 z-10">
            
            <div id="hold-indicator" class="relative flex items-center justify-center hidden opacity-0 transition-opacity duration-300 pb-4">
                <svg class="progress-ring filter drop-shadow-lg" width="90" height="90">
                    <circle class="text-black/50" stroke-width="6" stroke="currentColor" fill="rgba(0,0,0,0.5)" r="40" cx="45" cy="45"/>
                    <circle class="progress-ring__circle text-green-500" stroke-width="6" stroke="currentColor" fill="transparent" r="40" cx="45" cy="45" stroke-dasharray="251.32" stroke-dashoffset="251.32"/>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span class="relative bottom-[0.5rem] text-3xl font-bold text-white flex items-center justify-center">E</span>
                </div>
            </div>

            <div id="distress-container" class="transition-opacity duration-300 hidden">
                <div class="flex items-center bg-yellow-500/10 border border-yellow-500/20 px-6 py-3 rounded-lg animate-pulse">
                    <div class="keycap text-yellow-500 border-yellow-500/30">G</div>
                    <span id="ui-distress" class="text-yellow-100 font-semibold tracking-wide text-sm uppercase">Distress Signal Available</span>
                </div>
            </div>

            <div class="text-center space-y-2 py-2">
                <div id="status-text" class="text-3xl font-semibold tracking-wide text-glow text-gray-100"></div>
                <div id="respawn-text" class="text-xl font-light opacity-90 h-8 text-glow text-gray-300"></div>
            </div>
            
        </div>
    </div>

    <script type="text/javascript" src="main.js"></script>
</body>
</html>
