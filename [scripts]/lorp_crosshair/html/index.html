<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crossfire UI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Crosshair overlay -->
    <div id="crosshair" class="crosshair hidden">
      <div class="line up"></div>
      <div class="line down"></div>
      <div class="line left"></div>
      <div class="line right"></div>
      <div class="dot center"></div>
      <img id="pngCross" class="png-cross hidden" alt="cross" />
      <div class="ring" id="ring"></div>
      <div class="diag" id="diag1"></div>
      <div class="diag" id="diag2"></div>
    </div>

    <!-- Settings panel -->
    <div id="panel" class="panel hidden" tabindex="-1">
      <!-- Ambient glow background -->
      <div class="panel-bg"></div>
      <div class="panel-inner glass">
        <aside class="sidebar">
          <div class="brand">Crossfire</div>
          <nav>
            <div class="nav-item active">
              <span class="dot"></span>
              <span>General</span>
            </div>
          </nav>
        </aside>
        <main class="content">
          <h2 class="title">Crosshair settings</h2>
          <div class="grid">
          <label>Type
            <select id="type">
              <option value="vector">Vector</option>
              <option value="png">PNG</option>
            </select>
          </label>
          <label>Mode
            <select id="mode">
              <option value="always">Always</option>
              <option value="armed">Armed</option>
              <option value="aiming">Aiming</option>
            </select>
          </label>

          <label class="vector-only">Style
            <select id="style">
              <option value="classic">Classic</option>
              <option value="t">T</option>
              <option value="dot">Dot</option>
              <option value="circle">Circle</option>
              <option value="x">X</option>
            </select>
          </label>

          <label class="vector-only">Color
            <input id="color" type="color" value="#00ff8c" />
          </label>

          <label class="vector-only">Size (length)
            <input id="size" type="range" min="2" max="30" value="8" />
          </label>

          <label class="vector-only">Thickness
            <input id="thickness" type="range" min="1" max="10" value="2" />
          </label>

          <label class="vector-only">Gap
            <input id="gap" type="range" min="0" max="30" value="6" />
          </label>

          <label class="row vector-only">
            <input id="outline" type="checkbox" checked /> Outline
          </label>

          <label class="row vector-only">
            <input id="dotInCenter" type="checkbox" /> Dot in center
          </label>

          <!-- PNG controls -->
          <div class="png-only" id="pngControls">
            <label>PNG preset
              <div id="pngGrid" class="png-grid"></div>
            </label>
            <label>Scale
              <input id="pngScale" type="range" min="20" max="200" value="100" />
            </label>
            <label>Opacity
              <input id="pngOpacity" type="range" min="10" max="100" value="100" />
            </label>
          </div>
          </div>

          <div class="actions">
            <button id="save" class="btn btn-primary">Save</button>
            <button id="close" class="btn">Close</button>
          </div>

          <div class="preview-section">
            <div class="preview-title">Preview</div>
            <div id="preview" class="preview-box">
              <div id="previewCross" class="crosshair">
                <div class="line up"></div>
                <div class="line down"></div>
                <div class="line left"></div>
                <div class="line right"></div>
                <div class="dot center"></div>
                <img id="previewPngCross" class="png-cross" alt="preview" />
                <div class="ring" id="previewRing"></div>
                <div class="diag" id="previewDiag1"></div>
                <div class="diag" id="previewDiag2"></div>
              </div>
            </div>
          </div>
        </main>
        <!-- small corner brand -->
        <div class="logo-badge" aria-label="rMod">Leaned Out</div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
  </html>
