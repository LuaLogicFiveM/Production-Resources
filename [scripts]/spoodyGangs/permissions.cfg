#############################################
#        GANGS SCRIPT PERMISSIONS           #
#############################################

# =========================================
# 🔑 ADMIN / STAFF PERMISSIONS
# =========================================

# Full control over gangs (recommended for admins)
add_ace group.admin gangs.setgang allow
add_ace group.admin gangs.create allow
add_ace group.admin gangs.fdrop allow

# Or custom gangadmin group
add_ace group.gangadmin gangs.setgang allow
add_ace group.gangadmin gangs.create allow
add_ace group.gangadmin gangs.fdrop allow

# Add players to the group using identifiers
# Example (Steam):
# add_principal identifier.steam:110000112345678 group.gangadmin

# Example (License):
# add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx group.gangadmin